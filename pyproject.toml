[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrolls-context-assembly-benchmark"
version = "0.1.0"
description = "SCROLLS long-document QA benchmark for retrieval context assembly and chunk-ordering ablations."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "FORWARD Data Lab" }]
dynamic = ["dependencies"]

[project.scripts]
scrolls-benchmark = "benchmarking.run_benchmark:main"
scrolls-quick-check = "benchmarking.quick_check:main"
scrolls-check-generator = "benchmarking.check_generator:main"
scrolls-analyze = "analysis.analyze_outputs:main"
scrolls-analyze-ordering = "analysis.analyze_ordering_position_ablation:main"

[tool.setuptools]
packages = ["analysis", "benchmarking"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
